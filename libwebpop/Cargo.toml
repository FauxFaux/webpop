[package]
name = "libwebpop"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

description = "A direct port of parts of the WebP encoder, with identical output"
repository = "https://github.com/FauxFaux/webpop"
categories = ["multimedia::encoding", "multimedia::images"]

exclude=["/tests"]

[features]
# Build and run the pinned scalar C implementation only in the oracle tests.
native-oracle = []

[dependencies]
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["webp"] }

[[test]]
name = "native_oracle"
path = "tests/native_oracle.rs"
required-features = ["native-oracle"]


[[test]]
name = "near_lossless_streams"
path = "tests/near_lossless_streams.rs"
required-features = ["native-oracle"]
