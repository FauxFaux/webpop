[workspace]
resolver = "3"
members = ["cwebpop","libwebpop"]

[profile.dev]
opt-level = 1

# Optimize dependencies such as image codecs for native tests.
[profile.dev.package."*"]
opt-level = 3

# Keep release optimization while retaining source lines and inline call stacks.
[profile.profiling]
inherits = "release"
debug = 2
